name = "mnmll-pulse-os"
main = "src/index.ts"
compatibility_date = "2026-05-28"

[[d1_databases]]
binding = "DB"
database_name = "dark-planet-db"
database_id = "f59a6c68-f2d1-4ec9-9b2b-3bb0b4002669"

[[kv_namespaces]]
binding = "KV"
id = "a756cb93a78840df8313212689a57c9b"

[[r2_buckets]]
binding = "R2"
bucket_name = "dark-planet-assets"

[ai]
binding = "AI"

[[queues.producers]]
queue = "pulse-swarm-tasks"
binding = "SWARM_QUEUE"

[[queues.consumers]]
queue = "pulse-swarm-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[vars]
APP_URL = "https://mnmllpulse.com"
APP_VERSION = "14.3.0"
CORS_ORIGIN = "https://mnmllpulse.com,https://pulse-labs.org,https://mnmll-pulse-os.mnmllpulse.workers.dev"

[assets]
directory = "./frontend"
